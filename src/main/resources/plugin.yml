name: SPSMCBuildNoOres
version: 0.2.0
main: dev.spa.buildnoores.SpsmcBuildNoOresPlugin
api-version: "1.21"
description: Removes naturally generated ores from the build world while keeping normal terrain generation.
author: spa
load: STARTUP
softdepend:
  - Multiverse-Core
commands:
  buildnores:
    description: Scan existing generated build chunks and remove ore blocks once.
    usage: /buildnores scan|rescan
    permission: spsmcbuildnores.scan
    permission-message: このコマンドを実行する権限がありません。
permissions:
  spsmcbuildnores.scan:
    description: Run the one-time existing build world ore scan.
    default: op
